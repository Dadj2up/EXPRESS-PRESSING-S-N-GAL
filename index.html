<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B3A6E">
<title>EXPRESS PRESSING — Gestion réseau</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--b9:#1B3A6E;--b8:#264A87;--b7:#2F5BA3;--b1:#E8EEF8;--o5:#2A8F55;--bg:#F2F5F9;--l:#E2E8F0;--t:#152233;--m:#5C6B7C;--g:#268A54;--gb:#E4F5EC;--y:#C98A0F;--yb:#FBF0DA;--r:#C64236;--rb:#FBE7E5}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font:14px Inter,sans-serif;color:var(--t);overflow:hidden}
button{font:inherit;cursor:pointer}
input,select{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--l);border-radius:8px;background:#fff;min-width:0;width:100%}
.app{display:flex;height:100vh;height:100dvh}
.side{width:230px;background:var(--b9);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:transform .2s;z-index:30}
.sh{padding:20px 18px;border-bottom:1px solid #ffffff14;font:800 14px Sora}
.sh small{display:block;color:#8BD9A8;font-size:9.5px;letter-spacing:.08em;margin-top:3px}
.nav{flex:1;overflow:auto;padding:12px 10px}
.ni{display:flex;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;margin-bottom:2px;background:none;color:#ffffffad;font-size:13px;font-weight:500;text-align:left}
.ni:hover{background:#ffffff10;color:#fff}.ni.on{background:var(--o5);color:#fff;font-weight:700}
.sf{padding:14px 18px;border-top:1px solid #ffffff14;font-size:10px;color:#ffffff66}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:60px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--l);display:flex;align-items:center;gap:12px;padding:0 20px}
.top h2{font:700 17px Sora;color:var(--b9);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top span{font-size:12px;color:var(--m);font-weight:600;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont{flex:1;overflow:auto;padding:24px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi,.panel{background:#fff;border:1px solid var(--l);border-radius:14px;padding:16px}
.kpi{border-radius:9px}.kpi span{font-size:12px;color:var(--m);font-weight:500}.kpi b{display:block;font:700 20px Sora;color:var(--b9);margin-top:6px}
.panel{margin-bottom:16px;overflow-x:auto}.panel h3{font:700 14.5px Sora;color:var(--b9);margin-bottom:14px}
.btn{font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--l);background:#fff;color:var(--b8)}
.btn:hover{background:var(--b1)}.btn.o{background:var(--o5);color:#fff;border-color:var(--o5)}.btn.s{padding:5px 9px;font-size:11.5px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.f label{font-size:11.5px;color:var(--m);font-weight:600;display:block;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--m);font-weight:600;padding:8px;border-bottom:1px solid var(--l);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #eef2f6;white-space:nowrap}
td input{width:110px}
.pill{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--b1);color:var(--b7)}
.pill.ok{background:var(--gb);color:var(--g)}.pill.w{background:var(--yb);color:var(--y)}.pill.no{background:var(--rb);color:var(--r)}
.em{color:var(--m);padding:18px;text-align:center}
.per{display:flex;gap:8px;align-items:center;margin-bottom:14px;max-width:320px}
#login{position:fixed;top:0;right:0;bottom:0;left:0;z-index:99;background:linear-gradient(135deg,#1B3A6E,#264A87);display:flex;align-items:center;justify-content:center;padding:20px}
#login>div{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.burger{display:none}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:25;display:none;align-items:center;justify-content:center;width:64px;height:64px;padding:0;border:0;border-radius:50%;background:#d1a73c;color:#1a1a1a;box-shadow:0 8px 22px -6px rgba(180,130,20,.65)} .fab b{font-size:38px;line-height:1;font-weight:500}
.side .out{margin:0 10px 12px;width:auto}
#pub{position:fixed;top:0;right:0;bottom:0;left:0;overflow:auto;background:var(--bg);display:none}
.ban{display:block;width:100%;line-height:0;background:var(--b9)}.ban img{display:block;width:100%;height:auto}.ph{background:var(--b9);color:#fff;padding:22px 20px;display:flex;flex-direction:column;gap:4px}.ph b{font:800 18px Sora}.ph span{color:#8BD9A8;font-size:12px;font-weight:600}
.sub{font-size:11.5px;color:var(--m);margin-top:4px}.ol{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;align-items:end;margin-bottom:8px}.ol .lt{font-weight:700;padding:9px 0}.eb{min-width:150px}.eb .bar{height:8px;border-radius:6px;background:#E2E8F0;overflow:hidden;margin-bottom:4px}.eb .bar i{display:block;height:100%;border-radius:6px;transition:width .3s}.eb small{font-size:11px;font-weight:700}.ct a{color:var(--b8);font-weight:700;text-decoration:none}
.pw{max-width:720px;margin:0 auto;padding:18px}
@media(max-width:800px){.side{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}.side.open{transform:none}.burger{display:block}.lo{display:none}.top h2{font-size:16px}.top span{font-size:11px}.cont{padding-bottom:90px}.kpis{grid-template-columns:1fr 1fr}.cont{padding:14px}.top{padding:0 12px}}

.rcm{position:fixed;top:0;right:0;bottom:0;left:0;background:#0009;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}
.rcb{background:#fff;border-radius:14px;padding:16px;max-width:440px;width:100%;max-height:96vh;max-height:96dvh;overflow:auto}
.rcb h3{margin-bottom:10px;font:700 15px Sora}
.rcb img{width:100%;border:1px solid var(--l);border-radius:8px;display:block}
.rca{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rcb small{display:block;color:var(--m);margin-top:8px;font-size:11.5px}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;flex:none}.ni span{display:flex;align-items:center}.ni .ic{width:19px;height:19px}.burger .ic{width:22px;height:22px}.btn .ic{margin-right:6px}.ct .ic{margin-right:4px}
</style>
</head>

<div id="login"><div>
<div style="text-align:center;margin-bottom:8px"><div style="font:800 17px Sora;color:#0f2540">EXPRESS PRESSING</div><div id="lt" style="font-size:13px;color:#6b7280">Accès réservé — connectez-vous</div></div>

<div class="app">

<div class="sf">© 2026 Express Pressing Louga<br><span id="sft">Rapide, Propre, Efficace · 77 486 52 30</span></div>
</div>

</div>

<div class="panel"><h3>Actionnaires de « ${e(p.name)} » — ${T} actions de ${F(AP)} (capital ${F(T*AP)}), ${T-used} non attribuées</h3>${I.length?`<table><tr><th>Investisseur</th><th>Téléphone</th><th>Actions</th><th>Part</th><th>Investi</th><th>Dividende</th><th>Créé le</th><th>Dernière modification</th><th></th></tr>${I.map(u=>`<tr><td>${e(u.name)}</td><td>${e(u.tel||'—')}</td><td>${hpo(u,p.id).actions}</td><td>${(T?hpo(u,p.id).actions/T*100:0).toFixed(1)} %</td><td>${F(hpo(u,p.id).investi)}</td><td><b>${F(pool*hpo(u,p.id).actions/(T||1))}</b></td><td>${u.cr?dt(u.cr):'—'}</td><td>${u.mod?dt(u.mod)+(u.modBy?'<br><small>par '+e(u.modBy)+'</small>':''):'—'}</td><td><button class="btn s" onclick="editI('${u.id}')">Modifier</button> <button class="btn s" onclick="delU('${u.id}')">Supprimer</button></td></tr>`).join('')}</table>`:'<div class="em">Aucun investisseur dans ce poste</div>'}</div>`},

function addLine(){const d=document.createElement('div');d.className='ol';d.innerHTML=`<div><label>Service</label><select class="ls" onchange="calc()">${opts(S.services.map(s=>[s.id,`${s.name} — ${F(s.prix)}/${s.u==='kg'?'kg':'pièce'}`]))}</select></div><div><label>Quantité (kg ou pièces)</label><input class="lq" type="number" min="0" step="0.1" oninput="calc()"></div><div class="lt">0 F</div>`;$('olines').append(d);calc()}
function cardOpts(){const s=$('ocd');if(!s)return;s.innerHTML='<option value="">Sans carte</option>'+opts(S.cards.filter(c=>c.poste===v('op')&&c.reste>0&&c.exp>=today()).map(c=>[c.id,`${c.code} · ${c.client} · ${c.reste} kg`]));calc()}
function calc(){const c=S.cards.find(x=>x.id===v('ocd'));let left=c?c.reste:0,used=0,tot=0,kg=0;const L=[];
document.querySelectorAll('#olines .ol').forEach(r=>{const s=S.services.find(x=>x.id===r.querySelector('.ls').value),q=+r.querySelector('.lq').value||0;if(!s)return;let u=0;if((s.u||'kg')==='kg'){kg+=q;u=Math.min(q,left);left-=u;used+=u}const t=Math.round((q-u)*s.prix);tot+=t;r.querySelector('.lt').textContent=F(t);if(q>0)L.push({s:s.name,q,u:s.u||'kg',pu:s.prix||0,cu:u,t})});
$('oa').value=tot;$('ot2').textContent=(used?used.toFixed(1).replace(/\.0$/,'')+' kg pris sur la carte · ':'')+'À payer : '+F(tot)+(c&&c.exp?'':'');return{L,kg,c,u:+used.toFixed(2),t:tot}}
function addO(){try{addO2()}catch(x){console.error(x);alert('Enregistrement impossible : '+(x.message||x))}}
function addO2(){const{L,kg,c,u,t}=calc(),tel=v('ot').trim(),md=v('omd'),zone=v('oz').trim();if(!L.length||!v('oc').trim()||tel.replace(/\D/g,'').length<8)return alert('Indiquez le client, son téléphone (pour le suivi) et au moins une ligne avec sa quantité.');
if(md==='Livraison'&&!zone)return alert('Indiquez la zone de livraison.');
if(c){c.reste=+(c.reste-u).toFixed(2);put('cards',c)}
const o={id:uid(),no:'EP-'+uid().slice(-5).toUpperCase(),poste:v('op'),date:today(),ts:Date.now(),client:v('oc').trim(),tel,svc:L.map(l=>l.s).join(' + '),lines:L,kg,total:t,paid:Math.min(t,+v('oa')||0),mode:v('om'),mode2:md,zone,card:c?c.id:'',cardKg:u,st:'Reçu',by:me.id};S.orders.push(o);put('orders',o);render();Promise.resolve(recu(o.id)).catch(x=>{console.error(x);alert('Commande enregistrée, mais le reçu n’a pas pu être créé : '+(x.message||x))})}
const pay=id=>{const o=S.orders.find(x=>x.id===id);o.paid=o.total;put('orders',o);render()},nx=id=>{const o=S.orders.find(x=>x.id===id);o.st=ST[ST.indexOf(o.st)+1];put('orders',o);render()};

function banUp(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return alert('Choisissez une image.');const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const W=Math.min(1600,im.width),c=document.createElement('canvas');c.width=W;c.height=Math.round(im.height*W/im.width);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.85,d=c.toDataURL('image/jpeg',q);while(d.length>450000&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}if(d.length>450000)return alert('Image trop lourde, choisissez-en une plus petite.');banSet(d);alert('Bannière enregistrée.')};im.onerror=()=>alert('Image illisible.');im.src=u}

function myGain(){const u=me,H=hld(u).filter(h=>PO(h.poste)),mk=m=>{let net=0,pool=0,g=0;H.forEach(h=>{const P=PO(h.poste),T=pT(P)||1,pp=sum(pSP(P).filter(x=>x.inv),x=>x.pct)/100,x=(((SPS[h.poste]||{}).months)||{})[m]||{net:0},pl=Math.max(0,x.net)*pp;net+=x.net||0;pool+=pl;g+=pl*(h.actions||0)/T});return{net,pool,g}};
const keys=[...new Set(H.flatMap(h=>Object.keys(((SPS[h.poste]||{}).months)||{})))].sort().reverse(),maj=Math.max(0,...H.map(h=>(SPS[h.poste]||{}).maj||0)),rows=keys.map(m=>Object.assign({m},mk(m))),tot=sum(rows,r=>r.g),cur=per?mk(per):{net:sum(rows,r=>r.net),pool:sum(rows,r=>r.pool),g:tot};
return`<div class="kpis">${k('Mes postes',e(H.map(h=>PO(h.poste).name).join(' + ')||'—'))}${k('Montant investi',F(sum(H,h=>h.investi||0)))}${k('Gains cumulés',F(tot))}</div><div class="panel"><h3>Mes actions</h3><table><tr><th>Poste</th><th>Actions</th><th>Ma part</th><th>Investi</th></tr>${H.map(h=>{const T=pT(PO(h.poste))||1;return`<tr><td>${e(PO(h.poste).name)}</td><td>${h.actions||0} / ${T}</td><td>${((h.actions||0)/T*100).toFixed(1)} %</td><td>${F(h.investi)}</td></tr>`}).join('')}</table></div>`+perBar()+`<div class="panel"><h3>${per?'Mon gain — '+per.split('-').reverse().join('/'):'Mon gain — toute la période'}</h3><div class="kpis" style="margin:0"><div class="kpi"><span>Bénéfice net de l’entreprise</span><b>${F(cur.net)}</b></div><div class="kpi"><span>Dividendes à répartir</span><b>${F(cur.pool)}</b></div><div class="kpi" style="background:var(--gb)"><span>Mon gain</span><b style="color:var(--g)">${F(cur.g)}</b></div></div></div>
<div class="panel"><h3>Mes gains mois par mois</h3>${rows.length?`<table><tr><th>Mois</th><th>Bénéfice net</th><th>Dividendes à répartir</th><th>Mon gain</th></tr>${rows.map(r=>`<tr><td>${r.m.split('-').reverse().join('/')}</td><td>${F(r.net)}</td><td>${F(r.pool)}</td><td><b>${F(r.g)}</b></td></tr>`).join('')}</table>`:'<div class="em">Aucun chiffre publié pour le moment</div>'}<p class="sub">Votre gain = votre part des actions × la part de bénéfice net réservée aux investisseurs. Un mois sans bénéfice ne donne pas de dividende.${maj?' Chiffres arrêtés le '+dt(maj)+'.':''}</p></div>`}
