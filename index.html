<style>
  :root{
    --navy:#0E2A4A;
    --navy-2:#153A63;
    --teal:#1FA97F;
    --teal-light:#E6F6EF;
    --blue:#2E7CD6;
    --blue-light:#EAF2FC;
    --amber:#E2A23B;
    --amber-light:#FBF0DF;
    --red:#D65A4A;
    --red-light:#FBEAE7;
    --bg:#F5F7FA;
    --card:#FFFFFF;
    --line:#E4E9F0;
    --ink:#12233D;
    --ink-soft:#5B6B82;
    --ink-faint:#8A97AB;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{font-family:'Manrope',sans-serif;}
  #shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:84px;
  }
  /* Header */
  .topbar{
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 55%,#1C4E7A 100%);
    color:#fff;
    padding:22px 20px 26px;
    border-radius:0 0 24px 24px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:160px;height:160px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(31,169,127,0.35), transparent 70%);
  }
  .brand-row{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
  .brand-mark{
    width:38px;height:38px;border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;flex-shrink:0;overflow:hidden;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-name{font-size:13px;font-weight:700;letter-spacing:0.2px;}
  .brand-sub{font-size:10.5px;color:#B9CBE0;font-weight:500;}
  .topbar h1{
    font-size:21px;
    margin:16px 0 3px;
    font-weight:800;
    position:relative;z-index:1;
  }
  .topbar .sub{
    font-size:12.5px;color:#AFC4DC;font-weight:500;position:relative;z-index:1;
  }
  .stat-row{
    display:flex;gap:10px;margin-top:16px;position:relative;z-index:1;
  }
  .stat-pill{
    flex:1;background:rgba(255,255,255,0.09);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:12px;padding:10px 12px;
  }
  .stat-pill .n{font-size:17px;font-weight:800;font-family:'Manrope',sans-serif;}
  .stat-pill .l{font-size:10.5px;color:#B9CBE0;margin-top:1px;}

  /* content */
  .content{padding:16px 16px 8px;}
  .section-title{
    font-size:14px;font-weight:700;color:var(--ink);
    margin:18px 2px 10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .section-title .link{font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
  }
  .empty{
    text-align:center;padding:34px 18px;color:var(--ink-soft);
    background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
  }
  .empty .big{font-size:28px;margin-bottom:6px;}
  .empty p{font-size:13px;margin:4px 0 14px;line-height:1.5;}

  .btn{
    border:none;border-radius:12px;padding:12px 16px;
    font-family:'Inter',sans-serif;font-weight:700;font-size:14px;
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--ink);}
  .btn-block{width:100%;}
  .btn-danger-outline{background:var(--red-light);color:var(--red);}
  .btn-sm{padding:8px 12px;font-size:12.5px;border-radius:10px;}

  /* location card */
  .loc-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;
  }
  .loc-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .loc-name{font-weight:700;font-size:15px;}
  .status{
    font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;
  }
  .status.active{background:var(--teal-light);color:var(--teal);}
  .status.paused{background:var(--red-light);color:var(--red);}
  .status-toggle{display:flex;gap:8px;margin-top:2px;}
  .status-toggle button{
    flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;
    padding:8px 10px;font-size:12px;font-weight:700;font-family:'Inter',sans-serif;
    cursor:pointer;color:var(--ink-soft);
  }
  .status-toggle button.btn-open.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .status-toggle button.btn-close.on{background:var(--red);border-color:var(--red);color:#fff;}
  .loc-metrics{display:flex;gap:16px;}
  .metric{font-size:12px;color:var(--ink-soft);}
  .metric b{color:var(--ink);font-family:'Manrope',sans-serif;font-size:14px;display:block;}

  /* transaction row */
  .tx-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 0;border-bottom:1px solid var(--line);
  }
  .tx-row:last-child{border-bottom:none;}
  .tx-left{display:flex;align-items:center;gap:10px;}
  .tx-icon{
    width:36px;height:36px;border-radius:10px;background:var(--blue-light);
    display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
  }
  .tx-name{font-size:13.5px;font-weight:600;}
  .tx-meta{font-size:11px;color:var(--ink-faint);margin-top:1px;}
  .tx-amount{font-weight:800;font-size:14px;color:var(--teal);font-family:'Manrope',sans-serif;}

  /* bottom nav */
  .navbar{
    position:fixed;bottom:0;left:0;right:0;
    max-width:480px;margin:0 auto;
    background:#fff;border-top:1px solid var(--line);
    display:flex;padding:8px 6px 10px;
    box-shadow:0 -6px 20px rgba(18,35,61,0.06);
  }
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-faint);font-size:10.5px;font-weight:600;cursor:pointer;padding:4px 0;
  }
  .nav-item .ic{font-size:19px;}
  .nav-item.active{color:var(--navy);}
  .nav-item.active .ic{transform:translateY(-1px);}
  .fab{
    width:50px;height:50px;border-radius:50%;
    background:linear-gradient(135deg,var(--teal),#178C68);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:24px;margin-top:-26px;box-shadow:0 8px 18px rgba(31,169,127,0.4);
    cursor:pointer;
  }

  /* form */
  .field{margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:14px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--teal);}
  .chip-grid{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    padding:10px 13px;border-radius:11px;border:1.5px solid var(--line);
    font-size:12.5px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink);
  }
  .chip .p{display:block;font-size:11px;color:var(--ink-faint);font-weight:500;margin-top:2px;}
  .chip.sel{border-color:var(--teal);background:var(--teal-light);color:var(--teal);}
  .chip.sel .p{color:var(--teal);}

  .modal-back{
    position:fixed;inset:0;background:rgba(14,42,74,0.4);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .modal{
    background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;
    padding:20px 18px 26px;max-height:88vh;overflow-y:auto;
  }
  .modal-handle{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 14px;}
  .modal h3{margin:0 0 4px;font-size:17px;}
  .modal .msub{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .close-x{position:absolute;top:16px;right:16px;font-size:20px;color:var(--ink-faint);cursor:pointer;background:none;border:none;}
  .toprow-header{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .back-btn{background:var(--blue-light);color:var(--blue);border:none;width:32px;height:32px;border-radius:9px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .header-title{font-size:16px;font-weight:800;}
  .loading{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:13px;}
  .toast{
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:11px 18px;border-radius:30px;
    font-size:13px;font-weight:600;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,0.2);
  }
  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .sub-list-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .sub-list-row:last-child{border-bottom:none;}
  .price-edit{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);}
  .price-edit:last-child{border-bottom:none;}

  /* virtual subscription card */

  .verify-card.active{background:var(--teal-light);}

  .verify-title{font-size:16px;font-weight:800;}
  .verify-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}

  .sess{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;position:relative;z-index:1;}

  .sess .lnk{display:flex;gap:10px;}

  .tl b{color:var(--ink);}

  .pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}

  .mrow:last-child{border-bottom:none;}

<script>

var qrcode = function() {

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = new Array();

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw new Error('code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')');
      }

      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data) {
      var newData = qr8BitByte(data);
      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw new Error(row + ',' + col);
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      makeImpl(false, getBestMaskPattern() );
    };

    return _this;
  };

  qrcode.stringToBytes = function(s) {
    var bytes = new Array();
    for (var i = 0; i < s.length; i += 1) {
      var c = s.charCodeAt(i);
      bytes.push(c & 0xff);
    }
    return bytes;
  };

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3

function unitLabel(u){ return u==='piece' ? 'pièce' : 'kg'; }
function addMonths(dateStr, months){
  const d = new Date(dateStr);
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}

function defaultLocations(){
  const names = ['Point 1','Point 2','Point 3','Point 4','Point 5','Point 6','Point 7','Point 8','Point 9','Point 10'];
  return names.map((name,i)=>({id:uid(), name, status:'active', ts:Date.now()+i}));
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function fmt(n){ return (n||0).toLocaleString('fr-FR') + ' F'; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function startOfWeek(d){
  const dt = new Date(d);
  const day = (dt.getDay()+6)%7; // Monday=0
  dt.setHours(0,0,0,0);
  dt.setDate(dt.getDate()-day);
  return dt;
}

function applyStateDefaults(){
  const DEFAULT_WAVE_LINK = 'https://pay.wave.com/m/M_sn_Or8KycZjp3T-/c/sn/';
  if(!state.services) state.services = DEFAULT_SERVICES;
  state.services.forEach(s=>{ if(!s.unit) s.unit = (s.id==='couette'||s.id==='genter') ? 'piece' : 'kg'; });
  if(!state.plans) state.plans = DEFAULT_PLANS;
  state.plans.forEach(p=>{ if(p.weeklyKg===undefined || p.weeklyKg===null) p.weeklyKg = 7; });
  if(!state.locations) state.locations = [];
  if(!state.transactions) state.transactions = [];
  if(!state.subscriptions) state.subscriptions = [];
  if(!state.shopPhone) state.shopPhone = '781933741';
  if(state.adminPin === undefined) state.adminPin = '';
  if(state.settingsPin === undefined) state.settingsPin = '';
  if(!state.paymentNumbers) state.paymentNumbers = { orange:'', wave:'' };
  if(state.waveLink === undefined) state.waveLink = DEFAULT_WAVE_LINK;
  if(typeof ensureEpDefaults==='function') ensureEpDefaults();
}

function defaultState(){
  const DEFAULT_WAVE_LINK = 'https://pay.wave.com/m/M_sn_Or8KycZjp3T-/c/sn/';
  return { locations: defaultLocations(), transactions: [], subscriptions: [], services: DEFAULT_SERVICES, plans: DEFAULT_PLANS, shopPhone: '781933741', adminPin: '', settingsPin: '', paymentNumbers:{ orange:'', wave:'' }, waveLink: DEFAULT_WAVE_LINK };
}

let isRemoteWrite = false;

async function loadState(){
  try{
    const params = new URLSearchParams(window.location.search);
    if(params.get('client') === '1') appMode = 'client';
  }catch(e){}

  if(!fbDb){
    state = defaultState();
    showToast("Base de données non configurée — voir LISEZ-MOI.txt");
    render();
    return;
  }

  fbDb.ref(STORAGE_KEY).on('value', (snapshot)=>{
    const val = snapshot.val();
    if(val){
      state = val;
      applyStateDefaults();
    } else if(!state){
      state = defaultState();
      fbDb.ref(STORAGE_KEY).set(state);
    }
    const active = document.activeElement;
    const isTyping = active && (active.tagName==='INPUT' || active.tagName==='TEXTAREA');
    if(!isTyping && view !== 'scanCard') render();
  }, (err)=>{
    console.error(err);
    if(!state){ state = defaultState(); render(); }
    showToast("Connexion à la base de données impossible");
  });
}

async function saveState(){
  if(!fbDb){
    showToast("Base de données non configurée — voir LISEZ-MOI.txt");
    return;
  }
  try{
    // update() (et non set()) : les commandes, le ménage et les compteurs sont écrits
    // séparément pour que plusieurs employés puissent travailler en même temps sans s'écraser.
    const copy = JSON.parse(JSON.stringify(state));
    ['orders','menageLog','orderSeq'].forEach(k=>{ delete copy[k]; });
    await fbDb.ref(STORAGE_KEY).update(copy);
  }catch(e){
    showToast("Erreur d'enregistrement, réessayez");
  }
}

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  setTimeout(()=>t.remove(), 2200);
}

function go(v, extra){
  if(typeof allowedView==='function') v = allowedView(v);
  if(view === 'scanCard' && v !== 'scanCard') stopQrScanner();
  view = v;
  if(extra && extra.locId !== undefined) detailLocId = extra.locId;
  render();
}

function subStatus(s){
  return (s.endDate && s.endDate < todayISO()) ? 'expired' : 'active';
}

/* ---------- computations ---------- */
function txForLoc(locId){ return state.transactions.filter(t=>t.locationId===locId); }
function sumTx(list){ return list.reduce((s,t)=>s+t.amount,0); }
function todaysTx(list){ return list.filter(t=>t.date===todayISO()); }
function weekTx(list){
  const start = startOfWeek(new Date());
  return list.filter(t=> new Date(t.date) >= start);
}

  renderNav();
  attachHandlers();
}

function subDaysLeft(s){
  if(!s.endDate) return null;
  const end = new Date(s.endDate+'T00:00:00');
  const now = new Date(todayISO()+'T00:00:00');
  return Math.round((end-now)/86400000);
}
function subExpiryPercent(s){
  if(!s.startDate || !s.endDate) return 0;
  const start = new Date(s.startDate+'T00:00:00').getTime();
  const end = new Date(s.endDate+'T00:00:00').getTime();
  const now = new Date(todayISO()+'T00:00:00').getTime();
  if(end<=start) return 100;
  return Math.max(0, Math.min(100, ((now-start)/(end-start))*100));
}
function renderExpiryBar(s){
  if(!s.endDate) return '';
  const days = subDaysLeft(s);
  const pct = subExpiryPercent(s);
  const color = days<=0 ? 'var(--red)' : days<=5 ? 'var(--red)' : days<=15 ? 'var(--amber)' : 'var(--teal)';
  const label = days<=0 ? `Expiré depuis ${Math.abs(days)} j` : (days===0 ? "Expire aujourd'hui" : `${days} j restant${days>1?'s':''} avant expiration`);
  return `<div class="expiry-bar-wrap"><div class="expiry-bar" style="width:${pct}%;background:${color};"></div></div><div class="expiry-label" style="color:${color};">${label}</div>`;
}

let qrStream = null, qrRAF = null, qrLastCode = null, qrLastTime = 0;

async function startQrScanner(){
  const video = document.getElementById('qr-video');
  const statusEl = document.getElementById('scan-status');
  if(!video) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(statusEl) statusEl.textContent = "Caméra non disponible sur cet appareil/navigateur. Utilisez la saisie manuelle ci-dessous.";
    return;
  }
  try{
    qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
  }catch(e){
    if(statusEl) statusEl.textContent = "Impossible d'accéder à la caméra. Autorisez l'accès dans les réglages de Safari, ou utilisez la saisie manuelle.";
    return;
  }
  video.srcObject = qrStream;
  try{ await video.play(); }catch(e){}
  if(statusEl) statusEl.textContent = "Visez le QR code de la carte…";

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  const tick = ()=>{
    if(!qrStream) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = window.jsQR ? jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' }) : null;
      const now = Date.now();
      if(code && code.data && (code.data !== qrLastCode || now - qrLastTime > 3000)){
        qrLastCode = code.data;
        qrLastTime = now;
        if(navigator.vibrate) navigator.vibrate(80);
        if(statusEl) statusEl.textContent = "QR code détecté ✓";
        verifySubscription(code.data.replace('EPL-SUB:',''));
      }
    }
    qrRAF = requestAnimationFrame(tick);
  };
  qrRAF = requestAnimationFrame(tick);
}

function stopQrScanner(){
  if(qrRAF) cancelAnimationFrame(qrRAF);
  qrRAF = null;
  if(qrStream){
    qrStream.getTracks().forEach(t=>t.stop());
    qrStream = null;
  }
  qrLastCode = null;
}

function verifySubscription(code){
  const clean = (code||'').trim().toUpperCase();
  const s = state.subscriptions.find(x=>
    x.id.toUpperCase() === clean || x.id.slice(-6).toUpperCase() === clean
  );
  if(!s){
    openModal(`
      <h3>Carte introuvable</h3>
      <div class="msub">Aucun abonné ne correspond à ce code.</div>
      <button class="btn btn-outline btn-block" id="close-verify">Fermer</button>
    `);
    document.getElementById('close-verify').onclick = closeModal;
    return;
  }
  const loc = state.locations.find(l=>l.id===s.locationId);
  const st = subStatus(s);
  openModal(`
    <h3>Résultat de la vérification</h3>
    <div class="verify-card ${st}">
      <div class="verify-icon">${st==='active' ? '✅' : '⛔️'}</div>
      <div class="verify-title">${st==='active' ? 'Abonnement actif' : 'Abonnement expiré'}</div>
      <div class="verify-sub">${s.client}</div>
    </div>
    <div class="field" style="margin-top:16px;">
      <div style="font-size:12.5px;color:var(--ink-soft);line-height:1.8;">
        Local : ${loc? loc.name : '—'}<br>
        Formule : ${s.planLabel||'—'}<br>
        Début : ${s.startDate}<br>
        Expire : ${s.endDate}${(()=>{ const plan = state.plans.find(p=>p.id===s.planId); return (plan && (plan.weeklyKg!==null && plan.weeklyKg!==undefined)) ? `<br>Kg disponibles / semaine : ${plan.weeklyKg} kg` : ''; })()}
      </div>
    </div>
    <button class="btn btn-outline btn-block" id="close-verify">Fermer</button>
  `);
  document.getElementById('close-verify').onclick = ()=>{ closeModal(); go('subscriptions'); };
}

function findSubByPhone(phone){
  const clean = normalizePhone(phone);
  if(!clean) return null;
  return state.subscriptions.find(s => normalizePhone(s.phone) === clean) || null;
}

function sendShopWhatsApp(text){
  const p = normalizePhone(state.shopPhone);
  if(!p){
    showToast("Le numéro WhatsApp de la boutique n'est pas configuré. Contactez le gérant.");
    return;
  }
  window.open(`https://wa.me/${p}?text=${encodeURIComponent(text)}`, '_blank');
}

function attachClientHandlers(){
  document.querySelectorAll('[data-cnav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const target = el.getAttribute('data-cnav');
      if(target !== clientView) clientFlow = {};
      goClient(target);
    });
  });

  const backBtn = document.getElementById('back-to-manager');
  if(backBtn) backBtn.onclick = ()=>{
    appMode = 'manager'; view = (typeof roleHome==='function' ? roleHome() : 'dashboard'); render();
  };

  const lookupBtn = document.getElementById('lookup-btn');
  if(lookupBtn) lookupBtn.onclick = ()=>{
    const phone = document.getElementById('lookup-phone').value.trim();
    if(!phone){ showToast('Entrez votre numéro'); return; }
    const sub = findSubByPhone(phone);
    if(sub){
      clientFlow = { step:'found', sub, phone, planId: sub.planId };
    } else {
      clientFlow = { step:'new', phone, name:'' };
      showToast('Aucune carte trouvée pour ce numéro');
    }
    render();
  };

  const newMembershipBtn = document.getElementById('new-membership-btn');
  if(newMembershipBtn) newMembershipBtn.onclick = ()=>{
    clientFlow = { step:'new', phone: clientFlow.phone || '' };
    render();
  };

  const lookupBackBtn = document.getElementById('lookup-back-btn');
  if(lookupBackBtn) lookupBackBtn.onclick = ()=>{ clientFlow = {}; render(); };

  document.querySelectorAll('[data-cplan]').forEach(chip=>{
    chip.onclick = ()=>{
      const nameEl = document.getElementById('new-mem-name');
      const phoneEl = document.getElementById('new-mem-phone');
      const refEl = document.getElementById('pay-ref');
      if(nameEl) clientFlow.name = nameEl.value;
      if(phoneEl) clientFlow.phone = phoneEl.value;
      if(refEl) clientFlow.paymentRef = refEl.value;
      clientFlow.planId = chip.getAttribute('data-cplan');
      render();
    };
  });

  document.querySelectorAll('[data-pay]').forEach(chip=>{
    chip.onclick = ()=>{
      const nameEl = document.getElementById('new-mem-name');
      const phoneEl = document.getElementById('new-mem-phone');
      const refEl = document.getElementById('pay-ref');
      if(nameEl) clientFlow.name = nameEl.value;
      if(phoneEl) clientFlow.phone = phoneEl.value;
      if(refEl) clientFlow.paymentRef = refEl.value;
      clientFlow.paymentMethod = chip.getAttribute('data-pay');
      render();
    };
  });

  const payRefEl = document.getElementById('pay-ref');
  if(payRefEl) payRefEl.oninput = ()=>{ clientFlow.paymentRef = payRefEl.value; };

  const viewMyCardBtn = document.getElementById('view-my-card-btn');
  if(viewMyCardBtn) viewMyCardBtn.onclick = ()=>{ showSubCardModal(clientFlow.sub.id); };

  function paymentLine(){
    const method = clientFlow.paymentMethod;
    if(method === 'orange') return `Paiement : Orange Money — Réf. ${clientFlow.paymentRef || 'non renseignée'}`;
    if(method === 'wave') return `Paiement : Wave — Réf. ${clientFlow.paymentRef || 'non renseignée'}`;
    if(method === 'cash') return `Paiement : Espèces à la livraison`;
    return `Paiement : non précisé`;
  }

  const requestRenewBtn = document.getElementById('request-renew-btn');
  if(requestRenewBtn) requestRenewBtn.onclick = ()=>{
    if(!clientFlow.paymentMethod){ showToast('Choisissez un mode de paiement'); return; }
    if((clientFlow.paymentMethod==='orange' || clientFlow.paymentMethod==='wave') && !(clientFlow.paymentRef||'').trim()){
      showToast('Entrez la référence de votre paiement');
      return;
    }
    const plan = state.plans.find(p=>p.id===clientFlow.planId) || state.plans.find(p=>p.id===clientFlow.sub.planId);
    const text = `🧺 EXPRESS PRESSING SÉNÉGAL\nDemande de renouvellement\nClient : ${clientFlow.sub.client}\nTéléphone : ${clientFlow.sub.phone||clientFlow.phone}\nFormule souhaitée : ${plan? plan.label : ''} (${plan? fmt(plan.price):''})\n${paymentLine()}`;
    sendShopWhatsApp(text);
    showToast('Demande envoyée — le gérant confirmera votre renouvellement.');
  };

  const requestNewBtn = document.getElementById('request-new-btn');
  if(requestNewBtn) requestNewBtn.onclick = ()=>{
    const name = document.getElementById('new-mem-name').value.trim();
    const phone = document.getElementById('new-mem-phone').value.trim();
    if(!name){ showToast('Entrez votre nom'); return; }
    if(!phone){ showToast('Entrez votre numéro'); return; }
    if(!clientFlow.planId){ showToast('Choisissez une formule'); return; }
    if(!clientFlow.paymentMethod){ showToast('Choisissez un mode de paiement'); return; }
    if((clientFlow.paymentMethod==='orange' || clientFlow.paymentMethod==='wave') && !(clientFlow.paymentRef||'').trim()){
      showToast('Entrez la référence de votre paiement');
      return;
    }
    const plan = state.plans.find(p=>p.id===clientFlow.planId);
    const text = `🧺 EXPRESS PRESSING SÉNÉGAL\nDemande de nouvel abonnement\nNom : ${name}\nTéléphone : ${phone}\nFormule souhaitée : ${plan? plan.label:''} (${plan? fmt(plan.price):''})\n${paymentLine()}`;
    sendShopWhatsApp(text);
    showToast('Demande envoyée — le gérant confirmera votre abonnement.');
  };
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function normalizePhone(phone){
  let p = (phone||'').replace(/[^0-9+]/g,'');
  if(p && !p.startsWith('+')){
    if(p.length===9) p = '221'+p; // assume Senegal for a local 9-digit number
  }
  return p.replace('+','');
}

async function sharePDFBlob(blob, filename, text, phone){
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename, text});
      return;
    }
  }catch(e){ /* user cancelled or unsupported, fall through */ }
  downloadBlob(blob, filename);
  showToast('PDF téléchargé. Ouvrez WhatsApp pour joindre le fichier.');
  const p = normalizePhone(phone);
  const url = p ? `https://wa.me/${p}?text=${encodeURIComponent(text||'')}` : `https://wa.me/?text=${encodeURIComponent(text||'')}`;
  window.open(url, '_blank');
}

async function generateQR(text){
  try{
    let qr = null;
    for(let typeNumber = 1; typeNumber <= 15; typeNumber++){
      try{
        const candidate = qrcode(typeNumber, 'M');
        candidate.addData(text);
        candidate.make();
        qr = candidate;
        break;
      }catch(e){ /* too small, try next type number */ }
    }
    if(!qr) return null;
    const count = qr.getModuleCount();
    const cell = 6, margin = 12;
    const size = count * cell + margin * 2;
    const canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = '#0E2A4A';
    for(let r=0; r<count; r++){
      for(let c=0; c<count; c++){
        if(qr.isDark(r, c)){
          ctx.fillRect(margin + c*cell, margin + r*cell, cell, cell);
        }
      }
    }
    return canvas.toDataURL('image/png');
  }catch(e){
    return null;
  }
}

    const svc = state.services.find(s=>s.id===txDraft.serviceId);

    if(svc) txDraft.amount = Math.round(svc.price * txDraft.qty);
    const amtField = document.getElementById('tx-amount');
    if(amtField) amtField.value = txDraft.amount;
  };

  const txLoc = document.getElementById('tx-loc');
  if(txLoc) txLoc.onchange = ()=>{ txDraft.locationId = txLoc.value; };
  const txClient = document.getElementById('tx-client');
  if(txClient) txClient.oninput = ()=>{ txDraft.client = txClient.value; };
  const txPhone = document.getElementById('tx-phone');
  if(txPhone) txPhone.oninput = ()=>{ txDraft.phone = txPhone.value; };
  const txAmount = document.getElementById('tx-amount');

  const saveTxBtn = document.querySelector('[data-action="saveTx"]');

    if(!txDraft.locationId){ showToast('Choisissez un local'); return; }

    if(!txDraft.amount || txDraft.amount<=0){ showToast('Montant invalide'); return; }
    requireLocationCode(txDraft.locationId, async ()=>{
      const newTx = {
        id: uid(),
        locationId: txDraft.locationId,
        serviceId: txDraft.serviceId,
        client: txDraft.client || '',
        phone: txDraft.phone || '',
        amount: Number(txDraft.amount),
        qty: txDraft.qty || 1,
        date: txDraft.date || todayISO(),
        ts: Date.now()
      };
      state.transactions.push(newTx);
      await saveState();
      await createOrderFromTx(newTx, txDraft);
      txDraft = {};
      showReceiptModal(newTx);
    });

  document.querySelectorAll('[data-action="markPickup"]').forEach(btn=>{
    btn.onclick = async ()=>{
      const s = state.subscriptions.find(x=>x.id===btn.getAttribute('data-subid'));

    showToast('Réglages verrouillés');
  };

      if(navigator.clipboard && navigator.clipboard.writeText){

}catch(e){}

  }catch(e){}

  if(cfg.views==='*' || cfg.views.includes(v)) return v;
  return cfg.home;
}
function isBoss(){ return session && (session.role==='pdg' || session.role==='dg'); }

async function hashCode(s){
  const str = 'ep|'+String(s);
  try{
    if(window.crypto && crypto.subtle && window.TextEncoder){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h<<5)+h) ^ str.charCodeAt(i); }
  return 'f'+(h>>>0).toString(16);
}

        : `<p>Aucun employé enregistré. Le PDG peut en ajouter dans Réglages.</p>` ) }

      <div class="gate-logo"><img src="${LOGO_ICON}" alt="logo"><div class="t">EXPRESS PRESSING SÉNÉGAL</div><div class="s">Accès réservé à l'équipe</div></div>
      ${body}
      <div class="gate-err" id="g-err">${esc(gate.err)}</div>
      <div class="gate-link" data-x="gateClient">Je suis un client →</div>
    </div></div>`;
  const pwd = document.getElementById('g-pwd');
  if(pwd) pwd.onkeydown = e=>{ if(e.key==='Enter') gateLogin(); };
  const gr = document.getElementById('g-role'); if(gr) gr.onchange = ()=>{ gate.role = gr.value; };
  const gs = document.getElementById('g-staff'); if(gs) gs.onchange = ()=>{ gate.staffId = gs.value; };
  const n2 = document.getElementById('g-new2'); if(n2) n2.onkeydown = e=>{ if(e.key==='Enter') gateCreate(); };
}
function gateErr(msg){ gate.err = msg; const el = document.getElementById('g-err'); if(el) el.textContent = msg; }

async function gateCreate(){
  const a = (document.getElementById('g-new').value||'').trim();
  const b = (document.getElementById('g-new2').value||'').trim();
  const lg = document.getElementById('g-legacy');
  if(lg){
    const v = lg.value.trim();
    if(!v || (v!==state.adminPin && v!==state.settingsPin)){ gateErr('Ancien code incorrect'); return; }
  }
  if(a.length<4){ gateErr('Le code doit faire 4 caractères ou plus'); return; }
  if(a!==b){ gateErr('Les deux codes ne sont pas identiques'); return; }
  ensureEpDefaults();
  state.roleCodes.pdg = await hashCode(a);
  await saveState();
  session = {role:'pdg', name:'', ts:Date.now()}; saveSession();
  view = roleHome(); startHeartbeat(); render();
  showToast('Code PDG créé. Bienvenue !');
}

async function gateLogin(){
  if(Date.now() < gate.lockUntil){ gateErr('Trop d\'essais. Patientez quelques secondes.'); return; }
  const pwd = (document.getElementById('g-pwd').value||'').trim();
  if(!pwd){ gateErr('Entrez votre code'); return; }
  const h = await hashCode(pwd);
  const codes = state.roleCodes || {};
  let sess = null;
  if(gate.tab==='role'){
    const r = gate.role || ROLE_ORDER[0];
    if((codes[r] && h===codes[r]) || (codes.pdg && h===codes.pdg)) sess = {role:r, name:''};
    else if(!codes[r]){ gateErr('Aucun code défini pour ce poste. Demandez au PDG.'); return; }
  } else {
    const m = (state.staff||[]).find(x=>x.id===gate.staffId);
    if(m && m.code && h===m.code) sess = {role:m.role, name:m.name, staffId:m.id};
  }
  if(!sess){
    gate.fails++;
    if(gate.fails>=5){ gate.lockUntil = Date.now()+30000; gate.fails = 0; }
    gateErr('Code incorrect');
    return;
  }
  gate.fails = 0; gate.err = '';
  session = Object.assign(sess, {ts:Date.now()}); saveSession();
  view = roleHome(); startHeartbeat(); render();
}

/* ---------- commandes ---------- */
function allOrders(){ return Object.values((state && state.orders) || {}); }
function nextStatus(o){
  const steps = o.steps || ['recue','lavage','pret','livre'];
  const i = steps.indexOf(o.status);
  return (i>=0 && i<steps.length-1) ? steps[i+1] : null;
}
function canAdvance(role, o){
  const nx = nextStatus(o); if(!nx) return false;
  if(['pdg','dg','commandes'].includes(role)) return true;
  if(role==='service') return o.status==='recue' || o.status==='pret';
  if(role==='lavage') return o.status==='lavage' || (o.status==='recue' && nx==='lavage');
  if(role==='repassage') return o.status==='repassage' || (o.status==='recue' && nx==='repassage');
  return false;
}
function canResolve(role){ return ['pdg','dg','service','commandes'].includes(role); }
function advanceLabel(o){
  const nx = nextStatus(o);
  if(nx==='lavage') return 'Lancer le lavage';
  if(nx==='repassage') return o.status==='lavage' ? 'Lavage terminé → repassage' : 'Lancer le repassage';
  if(nx==='pret') return o.status==='lavage' ? 'Lavage terminé' : 'Repassage terminé';
  if(nx==='livre') return 'Marquer livrée';
  return 'Avancer';
}
function orderNumLabel(n){ return 'EP-'+String(n||0).padStart(4,'0'); }
function clean(o){ return JSON.parse(JSON.stringify(o)); }

async function nextOrderNumber(){
  if(fbDb){
    try{
      const r = await fbDb.ref(STORAGE_KEY+'/orderSeq').transaction(n=>(n||0)+1);
      return r.snapshot.val();
    }catch(e){}
  }
  state.orderSeq = (state.orderSeq||0)+1;
  return state.orderSeq;
}
async function writeOrder(o){
  ensureEpDefaults();
  state.orders[o.id] = o;
  if(fbDb){
    try{ await fbDb.ref(STORAGE_KEY+'/orders/'+o.id).set(clean(o)); }
    catch(e){ showToast("Erreur d'enregistrement, réessayez"); }
  }
}
async function createOrderFromTx(tx, draft){
  const svc = state.services.find(s=>s.id===tx.serviceId);
  const steps = ['recue'];
  if(svc && /repass/i.test(svc.id+' '+svc.name)) steps.push('repassage');
  else { steps.push('lavage'); if(draft && draft.ironing) steps.push('repassage'); }
  steps.push('pret','livre');
  const num = await nextOrderNumber();
  const o = {
    id: uid(), num, txId: tx.id, locationId: tx.locationId, serviceId: tx.serviceId,
    serviceName: svc ? svc.name : 'Service', unit: svc ? svc.unit : 'kg', qty: tx.qty || 1,
    client: tx.client || '', phone: tx.phone || '', amount: tx.amount, steps,
    status: 'recue', createdAt: Date.now(), date: tx.date,
    history: [{s:'recue', by:who(), role:session?session.role:'', ts:Date.now()}]
  };
  await writeOrder(o);
  return o;
}
async function advanceOrder(id){
  const o = (state.orders||{})[id];
  if(!o || !session || !canAdvance(session.role, o)){ showToast('Action non autorisée'); return; }
  const expected = o.status, nx = nextStatus(o);
  const entry = {s:nx, by:who(), role:session.role, ts:Date.now()};
  if(fbDb){
    try{
      const res = await fbDb.ref(STORAGE_KEY+'/orders/'+id).transaction(cur=>{
        if(cur===null) return cur;
        if(cur.status!==expected) return; // déjà modifiée par quelqu'un d'autre
        cur.status = nx;
        cur.history = (cur.history||[]).concat([entry]);
        return cur;
      });
      if(!res.committed){ showToast('Cette commande vient d\'être mise à jour par un collègue'); render(); return; }
    }catch(e){ showToast("Erreur d'enregistrement, réessayez"); return; }
  } else {
    o.status = nx; o.history = (o.history||[]).concat([entry]);
  }
  showToast(ORDER_STATUS[nx].ico+' '+orderNumLabel(o.num)+' → '+ORDER_STATUS[nx].label);
  render();
}

/* filtres par poste */
let orderUI = {filter:null, q:''};
function stageOfRole(role){ return role==='lavage' ? 'lavage' : role==='repassage' ? 'repassage' : null; }
function visibleOrders(){
  const st = stageOfRole(session.role);
  return allOrders().filter(o=> !st || (o.steps||[]).includes(st));
}
function filterDefs(){
  const st = stageOfRole(session.role);
  if(st) return [
    {id:'recue', label:'À prendre'}, {id:st, label:'En cours'}, {id:'done', label:'Terminées'}
  ];
  return [
    {id:'active', label:'Toutes en cours'}, {id:'recue', label:'Reçues'}, {id:'lavage', label:'Lavage'},
    {id:'repassage', label:'Repassage'}, {id:'pret', label:'Prêtes'}, {id:'livre', label:'Livrées'},
    {id:'issue', label:'Problèmes'}
  ];
}
function defaultFilter(){
  const st = stageOfRole(session.role);
  if(st) return st;
  if(session.role==='service') return 'pret';
  return 'active';
}
function matchesFilter(o, f){
  const st = stageOfRole(session.role);
  const steps = o.steps || [];
  if(st){
    if(f==='recue') return o.status==='recue';
    if(f===st) return o.status===st;
    if(f==='done') return steps.indexOf(o.status) > steps.indexOf(st) && o.status!=='livre';
    return true;
  }
  if(f==='active') return o.status!=='livre';
  if(f==='issue') return o.issue && !o.issue.resolved;
  return o.status===f;
}
function orderCardHTML(o){
  const role = session.role;
  const steps = o.steps || ['recue','lavage','pret','livre'];
  const idx = steps.indexOf(o.status);
  const loc = state.locations.find(l=>l.id===o.locationId);
  const last = (o.history||[]).filter(h=>ORDER_STATUS[h.s]).slice(-1)[0];
  const openIssue = o.issue && !o.issue.resolved;
  const btns = [];
  if(canAdvance(role,o)) btns.push(`<button class="btn btn-teal btn-sm" data-oact="advance" data-oid="${o.id}">${advanceLabel(o)}</button>`);

    btns.push(`<button class="btn btn-sm" style="background:#25D366;color:#fff;" data-oact="notify" data-oid="${o.id}">Prévenir le client</button>`);
  if(openIssue && canResolve(role)) btns.push(`<button class="btn btn-outline btn-sm" data-oact="resolve" data-oid="${o.id}">Problème résolu</button>`);
  if(o.status!=='livre' && !openIssue) btns.push(`<button class="btn btn-outline btn-sm" data-oact="issue" data-oid="${o.id}">Signaler</button>`);
  return `
  <div class="ocard ${openIssue?'issue':''}">

    <div class="oprog">${steps.map((s,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div>
    ${ last ? `<div class="olast">${ORDER_STATUS[last.s].label} · ${esc(last.by||'')} · ${fmtTime(last.ts)}</div>` : '' }
    ${ openIssue ? `<div class="obadge">⚠️ ${esc(o.issue.text)}</div>` : '' }
    ${ btns.length ? `<div class="oact">${btns.join('')}</div>` : '' }

function renderOrderList(){
  const f = orderUI.filter || defaultFilter();
  const q = (orderUI.q||'').trim().toLowerCase();
  let list = visibleOrders().filter(o=>matchesFilter(o,f));
  if(q) list = list.filter(o=> orderNumLabel(o.num).toLowerCase().includes(q) || (o.client||'').toLowerCase().includes(q) || (o.phone||'').replace(/\s/g,'').includes(q.replace(/\s/g,'')));

  if(!list.length) return `<div class="empty"><div class="big">🧺</div><p>Aucune commande ici pour le moment.</p></div>`;

/* ---------- ménage ---------- */
let menageUI = {locId:null};
function menageKey(locId, taskId){ return todayISO()+'_'+locId+'_'+taskId; }
function menageDone(locId){
  const log = state.menageLog || {};
  return (state.menageTasks||[]).filter(t=>log[menageKey(locId,t.id)]).length;
}
async function toggleMenage(locId, taskId){
  ensureEpDefaults();
  const key = menageKey(locId, taskId);
  if(state.menageLog[key]){
    delete state.menageLog[key];
    if(fbDb) fbDb.ref(STORAGE_KEY+'/menageLog/'+key).remove().catch(()=>{});
  } else {
    const rec = {by:who(), ts:Date.now()};
    state.menageLog[key] = rec;
    if(fbDb) fbDb.ref(STORAGE_KEY+'/menageLog/'+key).set(rec).catch(()=>{});
  }
  render();
}
function renderMenage(){
  const locs = state.locations || [];
  const tasks = state.menageTasks || [];
  const canEdit = session.role==='menage' || session.role==='pdg';
  if(!locs.length) return roleHeader('Ménage & entretien','') + `<div class="content"><div class="empty"><div class="big">🧹</div><p>Aucun local enregistré.</p></div></div>`;

  if(!locId){ try{ locId = localStorage.getItem('ep-menage-loc'); }catch(e){} }

  const done = menageDone(locId);

/* ---------- équipe (direction) ---------- */
function activityToday(){

  allOrders().forEach(o=>(o.history||[]).forEach(h=>{

    const k = (h.by||'')+'|'+(h.role||'');
    map[k] = map[k] || {name:h.by||'', role:h.role||'', n:0};
    map[k].n++;
  }));
  return Object.values(map).sort((a,b)=>b.n-a.n);
}

/* ---------- rendu principal ---------- */
function render(){
  const app = document.getElementById('app');
  if(!state){ app.innerHTML = '<div class="loading">Chargement…</div>'; return; }
  ensureEpDefaults();

  if(appMode === 'client'){
    let chtml = '';
    if(clientView==='home') chtml = renderClientHome();
    else if(clientView==='services') chtml = renderClientServices();
    else if(clientView==='membership') chtml = renderClientMembership();
    else if(clientView==='suivi') chtml = renderClientTracking();
    app.innerHTML = chtml;
    renderClientNav();
    attachClientHandlers();
    attachTrackingHandlers();
    return;
  }

  if(session && session.staffId && !(state.staff||[]).some(s=>s.id===session.staffId)){
    session = null; saveSession(); stopHeartbeat();
    gate.err = 'Votre accès a été retiré.';
  }
  if(!session){ renderGate(); return; }

  view = allowedView(view);
  let html = '';
  if(view==='dashboard') html = renderDashboard();
  else if(view==='orders') html = renderOrders();
  else if(view==='menage') html = renderMenage();
  else if(view==='team') html = renderTeam();
  else if(view==='more') html = renderMore();
  else if(view==='locations') html = renderLocations();
  else if(view==='locationDetail') html = renderLocationDetail();
  else if(view==='newTx') html = renderNewTx();
  else if(view==='subscriptions') html = renderSubscriptions();
  else if(view==='scanCard') html = renderScanCard();
  else if(view==='settings') html = renderSettings();
  app.innerHTML = html;
  renderNav();
  attachHandlers();
  if(view==='orders') attachOrdersUI();
}

/* ---------- actions (délégation, phase de capture) ---------- */
document.addEventListener('click', async (e)=>{
  const t = e.target;
  if(!t || !t.closest) return;
  const of = t.closest('[data-ofilter]');
  if(of){ orderUI.filter = of.getAttribute('data-ofilter'); orderUI.q = ''; if(view==='orders') render(); }

  const oa = t.closest('[data-oact]');
  if(oa){
    const id = oa.getAttribute('data-oid'), a = oa.getAttribute('data-oact');
    if(a==='advance'){ oa.disabled = true; await advanceOrder(id); }
    else if(a==='notify') notifyClient(id);
    else if(a==='issue') issueModal(id);
    else if(a==='resolve') resolveIssue(id);
    else if(a==='detail') orderDetailModal(id);
    return;
  }
  const x = t.closest('[data-x]');
  if(!x) return;
  const act = x.getAttribute('data-x');
  if(act==='logout') logout();
  else if(act==='closeModal') closeModal();
  else if(act==='gateTab'){ gate.tab = x.getAttribute('data-v'); gate.err = ''; renderGate(); }
  else if(act==='gateLogin') gateLogin();
  else if(act==='gateCreate') gateCreate();
  else if(act==='gateClient'){ appMode = 'client'; clientView = 'home'; clientFlow = {}; render(); }
  else if(act==='saveIssue') saveIssue(x.getAttribute('data-oid'));
  else if(act==='mloc'){ menageUI.locId = x.getAttribute('data-loc'); try{ localStorage.setItem('ep-menage-loc', menageUI.locId); }catch(err){} render(); }
  else if(act==='mtoggle') toggleMenage(x.getAttribute('data-loc'), x.getAttribute('data-task'));
  else if(act==='saveRoleCodes'){
    if(!session || session.role!=='pdg') return;
    ensureEpDefaults();
    let n = 0, bad = false;
    for(const inp of document.querySelectorAll('[data-rolecode]')){
      const v = inp.value.trim(); if(!v) continue;
      if(v.length<4){ bad = true; continue; }
      state.roleCodes[inp.getAttribute('data-rolecode')] = await hashCode(v); n++;
    }
    if(bad){ showToast('Chaque code doit faire 4 caractères ou plus'); if(!n) return; }
    if(!n){ showToast('Aucun nouveau code saisi'); return; }
    await saveState(); render(); showToast(n+' code'+(n>1?'s':'')+' enregistré'+(n>1?'s':''));
  }
  else if(act==='addStaff'){
    if(!session || session.role!=='pdg') return;
    const name = document.getElementById('st-name').value.trim();
    const role = document.getElementById('st-role').value;
    const code = document.getElementById('st-code').value.trim();
    if(!name){ showToast('Entrez le nom'); return; }
    if(code.length<4){ showToast('Le code doit faire 4 caractères ou plus'); return; }
    ensureEpDefaults();
    state.staff.push({id:uid(), name, role, code: await hashCode(code)});
    await saveState(); render(); showToast('Employé ajouté');
  }
  else if(act==='delStaff'){
    if(!session || session.role!=='pdg') return;
    const id = x.getAttribute('data-id');
    state.staff = (state.staff||[]).filter(m=>m.id!==id);
    if(fbDb) fbDb.ref(PRES_KEY+'/'+id).remove().catch(()=>{});
    await saveState(); render(); showToast('Employé retiré');
  }
  else if(act==='saveMenageTasks'){
    if(!session || session.role!=='pdg') return;
    const lines = document.getElementById('menage-tasks').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!lines.length){ showToast('Ajoutez au moins une tâche'); return; }
    const old = state.menageTasks || [];
    state.menageTasks = lines.map((name,i)=>{ const m = old.find(t=>t.name===name); return {id: m?m.id:('mt'+uid()), name}; });
    await saveState(); render(); showToast('Tâches enregistrées');
  }
}, true);

if(session) startHeartbeat();

loadState();
</script>
</body>
</html>
