const b=db.batch();b.set(db.doc('ep-roles/'+nuid),{role:u.role,poste:u.poste||null,postes:u.role==='investisseur'?hld(u).map(h=>h.poste):[],userId:u.id});b.set(db.doc('ep-login/'+key),{email,u:u.id});

function jr(m){const D={};const g=d=>D[d]||(D[d]={r:0,x:0});S.orders.filter(o=>!m||o.date.startsWith(m)).forEach(o=>g(o.date).r+=o.paid);S.cards.filter(c=>!m||c.date.startsWith(m)).forEach(c=>g(c.date).r+=c.prix);S.expenses.filter(x=>!m||x.date.startsWith(m)).forEach(x=>g(x.date).x+=x.m);

async function syncAccess(u){if(!u.auid)return;const key=sha(u.role==='investisseur'?'p:'+ph(u.tel):'n:'+u.name.toLowerCase()),b=db.batch();b.set(db.doc('ep-roles/'+u.auid),{role:u.role,poste:u.poste||null,postes:u.role==='investisseur'?hld(u).map(h=>h.poste):[],userId:u.id});
if(key!==u.lkey){const ex=await db.doc('ep-login/'+key).get();if(ex.exists&&ex.data().u!==u.id)throw new Error('Cet identifiant (nom ou téléphone) est déjà utilisé.');b.set(db.doc('ep-login/'+key),{email:em(u.id,u.av),u:u.id});if(u.lkey)b.delete(db.doc('ep-login/'+u.lkey));u.lkey=key}await b.commit()}
async function saveU(){const u=S.users.find(x=>x.id===EU);if(!u)return;const pd=u.role==='pdg',n=v('un').trim(),r=pd?'pdg':v('ur'),po=pd?null:v('up'),c=pd?'':v('uc').trim();if(!n)return alert('Nom requis.');if(c&&c.length<4)return alert('Code : 4 caractères minimum.');
if(S.users.some(x=>x.role!=='investisseur'&&x.id!==u.id&&x.name.toLowerCase()===n.toLowerCase()))return alert('Ce nom existe déjà.');if(r==='responsable'&&S.users.some(x=>x.id!==u.id&&x.role==='responsable'&&x.poste===po))return alert('Ce poste a déjà un responsable.');
const need=!pd&&(!u.auid||!!c);if(need&&!c)return alert('Saisissez un code d’accès pour créer le compte de cette personne.');const nu=Object.assign({},u,{name:n,role:r,poste:po});
try{if(need)await provision(nu,c);else await syncAccess(nu);nu.mod=Date.now();nu.modBy=me.name;await db.doc('ep-users/'+nu.id).set(nu)}catch(x){return alert('Modification impossible : '+(x.message||x))}EU=null;render()}

function myGain(){const u=me,H=hld(u).filter(h=>PO(h.poste)),mk=m=>{let net=0,pool=0,g=0;H.forEach(h=>{const P=PO(h.poste),T=pT(P)||1,pp=sum(pSP(P).filter(x=>x.inv),x=>x.pct)/100,x=(((SPS[h.poste]||{}).months)||{})[m]||{net:0},pl=Math.max(0,x.net)*pp;net+=x.net||0;pool+=pl;g+=pl*(h.actions||0)/T});return{net,pool,g}};
const keys=[...new Set(H.flatMap(h=>Object.keys(((SPS[h.poste]||{}).months)||{})))].sort().reverse(),maj=Math.max(0,...H.map(h=>(SPS[h.poste]||{}).maj||0)),rows=keys.map(m=>Object.assign({m},mk(m))),tot=sum(rows,r=>r.g),cur=per?mk(per):{net:sum(rows,r=>r.net),pool:sum(rows,r=>r.pool),g:tot};
return`<div class="kpis">${k('Mes postes',e(H.map(h=>PO(h.poste).name).join(' + ')||'—'))}${k('Montant investi',F(sum(H,h=>h.investi||0)))}${k('Gains cumulés',F(tot))}</div><div class="panel"><h3>Mes actions</h3><table><tr><th>Poste</th><th>Actions</th><th>Ma part</th><th>Investi</th></tr>${H.map(h=>{const T=pT(PO(h.poste))||1;return`<tr><td>${e(PO(h.poste).name)}</td><td>${h.actions||0} / ${T}</td><td>${((h.actions||0)/T*100).toFixed(1)} %</td><td>${F(h.investi)}</td></tr>`}).join('')}</table></div>`+perBar()+`<div class="panel"><h3>${per?'Mon gain — '+per.split('-').reverse().join('/'):'Mon gain — toute la période'}</h3><div class="kpis" style="margin:0"><div class="kpi"><span>Bénéfice net de l’entreprise</span><b>${F(cur.net)}</b></div><div class="kpi"><span>Dividendes à répartir</span><b>${F(cur.pool)}</b></div><div class="kpi" style="background:var(--gb)"><span>Mon gain</span><b style="color:var(--g)">${F(cur.g)}</b></div></div></div>
<div class="panel"><h3>Mes gains mois par mois</h3>${rows.length?`<table><tr><th>Mois</th><th>Bénéfice net</th><th>Dividendes à répartir</th><th>Mon gain</th></tr>${rows.map(r=>`<tr><td>${r.m.split('-').reverse().join('/')}</td><td>${F(r.net)}</td><td>${F(r.pool)}</td><td><b>${F(r.g)}</b></td></tr>`).join('')}</table>`:'<div class="em">Aucun chiffre publié pour le moment</div>'}<p class="sub">Votre gain = votre part des actions × la part de bénéfice net réservée aux investisseurs. Un mois sans bénéfice ne donne pas de dividende.${maj?' Chiffres arrêtés le '+dt(maj)+'.':''}</p></div>`}

function readParts(id,a,m){const L=[[v('ipo'),a,m],[v('ipo2'),+v('ia2')||0,+v('im2')||0]].filter((x,i)=>i===0||x[0]),out=[];if(L.length>1&&L[0][0]===L[1][0])return'Choisissez deux postes différents.';for(const [po,ac,mo] of L){const PP=PO(po);if(!PP)return'Choisissez un poste.';const oth=S.users.filter(x=>x.role==='investisseur'&&x.id!==id).reduce((q,x)=>q+hpo(x,po).actions,0);if(oth+ac>pT(PP))return'Total d’actions du poste « '+PP.name+' » dépassé : il reste '+Math.max(0,pT(PP)-oth)+' actions disponibles.';out.push({poste:po,actions:ac,investi:mo})}return out}
async function saveI(){const u=S.users.find(x=>x.id===EI);if(!u)return;const n=v('in').trim(),c=v('ic').trim(),t=v('it').trim(),a=+v('ia')||0,m=+v('im')||0;if(!n)return alert('Nom requis.');if(ph(t).length<8)return alert('Indiquez le numéro de téléphone de l’investisseur (il sert à se connecter).');if(S.users.some(x=>x.role==='investisseur'&&x.id!==EI&&ph(x.tel)===ph(t)))return alert('Ce numéro est déjà utilisé par un autre investisseur.');
const pr=readParts(EI,a,m);if(typeof pr==='string')return alert(pr);const po=pr[0].poste;

const nu=Object.assign({},u,{name:n,actions:a,investi:m,tel:t,poste:po,parts:pr}),changed=JSON.stringify([u.name,u.tel,hld(u)])!==JSON.stringify([n,t,pr])||!!c;
